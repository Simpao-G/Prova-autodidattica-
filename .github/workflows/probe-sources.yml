# TEMPORANEO: verifica le fonti delle classifiche. Da cancellare.
name: Prova fonti classifiche (temporaneo)

on:
  push:
    paths:
      - .github/workflows/probe-sources.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: r/anime Awards, file per anno
        run: |
          set +e
          B=https://r-anime.github.io/animeawards/data
          for y in 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            code=$(curl -s --max-time 20 -o "a$y.json" -w "%{http_code}" "$B/$y.json"); echo "$y: $code $(wc -c < a$y.json)"
          done
          for f in a20*.json; do
            if jq -e . "$f" >/dev/null 2>&1; then
              echo "== $f"
              jq -c 'if type == "object" then keys else (.[0]|keys) end' "$f"
              jq -c '(.sections // .)[0] | {name, keys: keys, awards: ((.awards // [])[0] | if . then {keys: keys, sample: (tojson | .[0:1500])} else null end)}' "$f" | head -c 2500; echo
            fi
          done
