# TEMPORANEO: verifica le fonti delle classifiche. Da cancellare.
name: Prova fonti classifiche (temporaneo)

on:
  push:
    paths:
      - .github/workflows/probe-sources.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Database offline (manami-project)
        run: |
          set +e
          curl -sL --max-time 120 -o db.json "https://github.com/manami-project/anime-offline-database/releases/latest/download/anime-offline-database-minified.json"
          echo "http size: $(wc -c < db.json)"
          head -c 300 db.json; echo
          jq -c '{keys: (.|keys), lastUpdate, n: (.data|length), first: .data[0]}' db.json | head -c 3000; echo
          echo "== con score"; jq '[.data[] | select(.score != null)] | length' db.json
          echo "== Frieren"; jq -c '.data[] | select(.sources | index("https://anilist.co/anime/154587")) | {title, type, episodes, animeSeason, score, tags: .tags[0:5]}' db.json
          echo "== Steins;Gate"; jq -c '.data[] | select(.sources | index("https://myanimelist.net/anime/9253")) | {title, score, sources}' db.json
          echo "== file della release"
          curl -sL --max-time 30 "https://api.github.com/repos/manami-project/anime-offline-database/releases/latest" | jq -c '[.assets[] | {name, size}]'
      - name: Jikan (di nuovo)
        if: always()
        run: |
          set +e
          for u in "https://api.jikan.moe/v4/anime/52991" "https://api.jikan.moe/v4/anime/52991/episodes"; do
            echo "== $u"
            curl -s --max-time 25 -w "\n[http %{http_code} %{time_total}s]\n" -o out.json "$u"
            jq -c '.data | if type == "array" then {keys: (.[0]|keys), first: .[0]} else {mal_id, score, scored_by} end' out.json 2>/dev/null || head -c 300 out.json
            sleep 2
          done
      - name: r/anime Awards (dati)
        if: always()
        run: |
          set +e
          curl -sL --max-time 25 https://r-anime.github.io/animeawards/index.js -o index.js
          echo "index.js: $(wc -c < index.js)"
          grep -oE "(fetch|axios[.a-z]*|import|require)\([^)]{0,120}\)" index.js | sort -u | head -40
          grep -oE "[\"'][^\"' ]*(data|results|json|\.js)[^\"' ]*[\"']" index.js | sort -u | head -60
          head -c 1500 index.js; echo
