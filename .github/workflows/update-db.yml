name: Aggiorna database anime

on:
  push:
    paths:
      - scripts/build-db.mjs
      - .github/workflows/update-db.yml
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # ogni lunedì

permissions:
  contents: write

concurrency:
  group: update-db
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scarica gli anime da AniList
        run: node scripts/build-db.mjs
      - name: Salva il database nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          # Il database appena scaricato vince sempre: lo mettiamo da parte, ci allineiamo
          # all'ultima versione del branch (che può essere cambiata durante il download)
          # e lo rimettiamo al suo posto. Se intanto arriva un altro push, riprova.
          rm -rf "$RUNNER_TEMP/data" && mv data "$RUNNER_TEMP/data"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            rm -rf data && cp -r "$RUNNER_TEMP/data" data
            git add -A data
            if git diff --cached --quiet; then
              echo "Nessuna novità"
              exit 0
            fi
            git commit -m "Aggiorna database anime"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Il branch è cambiato nel frattempo, riprovo…"
            sleep 5
          done
          exit 1
