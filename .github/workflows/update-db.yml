name: Aggiorna database anime

on:
  push:
    paths:
      - scripts/build-db.mjs
      - .github/workflows/update-db.yml
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # ogni lunedì

permissions:
  contents: write

concurrency:
  group: update-db
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scarica gli anime da AniList
        run: node scripts/build-db.mjs
      - name: Salva il database nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nessuna novità"
          else
            git commit -m "Aggiorna database anime"
            git pull --rebase
            git push
          fi
